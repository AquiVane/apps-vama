<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Apps VAMA | Tienda de apps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{--b1:#0A1A2B;--b2:#0B5FA5;--ac:#7FE0A8;--fg:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--fg);background:linear-gradient(160deg,var(--b1),var(--b2));display:grid;place-items:center;min-height:100vh;padding:24px 16px}
main{max-width:640px;text-align:center}
h1{font-family:'Playfair Display',serif;font-size:clamp(34px,8vw,56px);margin:0 0 8px}
.tag{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin:0 0 14px}
p{font-size:18px;line-height:1.55;margin:0 0 22px}
ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
li{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:500;background:rgba(255,255,255,.08)}
</style>
</head>
<body>
<main>
<p class="tag">VAMA</p>
<h1>Apps VAMA</h1>
<p>Estamos armando la tienda de apps. Muy pronto vas a poder conocerlas y descargarlas acá.</p>
<ul><li>Finanzas</li><li>Juegos</li><li>Hábitos saludables</li></ul>
</main>
</body>
</html>
